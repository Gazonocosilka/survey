<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Відповіді постачальника · Room 21</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<style>
:root{--grey:#545454;--gold:#E2D5AC;--ink:#1f1f1f;--muted:#6b6b6b;--line:#e3e3e3;--ok:#2e7d32;--okbg:#e8f3e8;--no:#b3261e;--nobg:#fbeaea;--q:#8a6d00;--qbg:#fbf3dc}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#f6f5f2}
.band{background:var(--grey);color:var(--gold);display:flex;align-items:center;gap:16px;padding:14px 20px;flex-wrap:wrap}
.band img{height:56px;display:block}
.band h1{font-family:Poppins,Arial,sans-serif;font-weight:400;font-size:22px;letter-spacing:.5px;margin:0;flex:1;min-width:200px;text-align:center;line-height:1.25}
main{max-width:860px;margin:0 auto;padding:18px 14px 60px}
.card{background:#fff;border:1px solid var(--line);padding:14px 16px;margin-bottom:14px;font-size:14px;line-height:1.5}
.summary{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:#fafafa}
.pill.ok{background:var(--okbg);color:var(--ok);border-color:#cfe5cf}
.pill.no{background:var(--nobg);color:var(--no);border-color:#efcfcc}
.pill.q{background:var(--qbg);color:var(--q);border-color:#efe0b0}
.tabs{display:flex;gap:6px;margin:4px 0 6px;flex-wrap:wrap}
.tabs button{font:inherit;font-size:13px;padding:7px 14px;border:1px solid var(--line);background:#fff;cursor:pointer;border-radius:4px}
.tabs button.on{background:var(--grey);color:var(--gold);border-color:var(--grey)}
h2{font-family:Poppins,Arial,sans-serif;font-weight:600;font-size:16px;margin:22px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--gold)}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:14px 0 6px}
.row{background:#fff;border:1px solid var(--line);border-left:4px solid #ccc;padding:9px 12px;margin-bottom:6px;font-size:14px}
.row.yes{border-left-color:var(--ok)} .row.no{border-left-color:var(--no)} .row.q{border-left-color:#d9b54a}
.name{font-weight:600}
.qty{color:var(--muted);font-weight:400;margin-left:6px;font-size:13px}
.st{float:right;font-size:12px;font-weight:600}
.st.yes{color:var(--ok)} .st.no{color:var(--no)} .st.p{color:var(--muted)}
.c{margin-top:5px;font-size:13px;background:#fafaf7;border-left:2px solid var(--gold);padding:4px 8px}
.tag{display:inline-block;font-size:10px;font-weight:600;text-transform:uppercase;padding:2px 6px;margin-left:6px;background:#eef0f7;color:#3b4a7a}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.log .when{font-size:12px;color:var(--muted);font-weight:600;margin:14px 0 4px}
.log .ev{font-size:14px;padding:6px 10px;background:#fff;border:1px solid var(--line);margin-bottom:4px}
.done{color:var(--ok);font-weight:600}
.muted{color:var(--muted);font-size:12px}
a{color:#3b4a7a}
</style>
</head>

<main>
  <div class="card" id="head">Завантаження…</div>
  <div class="tabs"><button data-t="sum" class="on">Підсумок</button><button data-t="log">Історія змін</button><button id="reload">Оновити</button></div>
  <div id="out"></div>
</main>
<script>
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = iso => new Date(iso).toLocaleString('uk-UA',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const ST = {yes:'Є в комплекті', no:'Немає', '':'Не перевірено'};
let H = null, tab = 'sum';

async function load(){
  const r = await fetch('/api/history', {cache:'no-store'});
  H = await r.json();
  render();
}
const latest = () => H.saves.length ? H.saves[H.saves.length-1].state : H.initial;

function render(){
  const S = latest();
  document.getElementById('proj').textContent = S.project || '';
  let y=0,n=0,p=0; S.groups.forEach(g=>g.items.forEach(i=>{ i.s==='yes'?y++:i.s==='no'?n++:p++; }));
  const qOpen = S.questions.filter(q=>!q.a).length;
  const last = H.saves.length ? H.saves[H.saves.length-1].ts : null;
  document.getElementById('head').innerHTML =
    (last ? 'Остання зміна: <b>'+fmt(last)+'</b>' : '<b>Постачальник ще нічого не відповів.</b>') +
    (S.confirm ? '<div class="done">✓ Підтверджено: '+esc(S.confirm.name)+', '+esc(S.confirm.date)+'</div>' : '<div class="muted">Фінальне підтвердження ще не натиснуто.</div>') +
    '<div class="summary"><span class="pill ok">Є: '+y+'</span><span class="pill no">Немає: '+n+'</span><span class="pill">Не перевірено: '+p+'</span><span class="pill q">Питань без відповіді: '+qOpen+'</span></div>' +
    '<div class="muted" style="margin-top:8px">Сторінка для постачальника: <a href="/" target="_blank">'+location.host+'/</a></div>';
  document.querySelectorAll('.tabs button[data-t]').forEach(b=>b.classList.toggle('on', b.dataset.t===tab));
  document.getElementById('out').innerHTML = tab==='sum' ? summary(S) : log();
}

function itemRow(it, gTitle){
  const s = it.s||'';
  return '<div class="row '+s+'"><span class="st '+(s||'p')+'">'+ST[s]+'</span><span class="name">'+esc(it.n)+'</span><span class="qty">· '+esc(it.q)+'</span>'+
    (it.by?'<span class="tag">додав постачальник</span>':'')+
    (gTitle?'<div class="muted">'+esc(gTitle)+'</div>':'')+
    (it.c?'<div class="c">'+esc(it.c)+'</div>':'')+'</div>';
}

function summary(S){
  const all = []; S.groups.forEach(g=>g.items.forEach(it=>all.push([it,g.t])));
  const no = all.filter(([i])=>i.s==='no'), cm = all.filter(([i])=>i.c && i.s!=='no'), added = all.filter(([i])=>i.by);
  let h = '<h2>Потребує уваги</h2>';
  h += '<h3>Відповіді на питання</h3>' + S.questions.map(q=>'<div class="row q"><div class="name">'+esc(q.t)+'</div>'+(q.a?'<div class="c">'+esc(q.a)+'</div>':'<div class="muted">Без відповіді</div>')+'</div>').join('');
  h += '<h3>Немає в комплекті ('+no.length+')</h3>' + (no.length ? no.map(([i,g])=>itemRow(i,g)).join('') : '<div class="empty">—</div>');
  h += '<h3>Коментарі ('+cm.length+')</h3>' + (cm.length ? cm.map(([i,g])=>itemRow(i,g)).join('') : '<div class="empty">—</div>');
  h += '<h3>Додав постачальник ('+added.length+')</h3>' + (added.length ? added.map(([i,g])=>itemRow(i,g)).join('') : '<div class="empty">—</div>');
  h += '<h2>Усі позиції</h2>' + S.groups.map(g=>'<h3>'+esc(g.t)+'</h3>'+g.items.map(i=>itemRow(i)).join('')).join('');
  return h;
}

function diff(a, b){
  const ev = [];
  b.questions.forEach((q,i)=>{ const o=a.questions[i]; if(!o || (o.a||'')!==(q.a||'')) ev.push('Питання «'+esc(q.t)+'»: <b>'+(q.a?esc(q.a):'відповідь видалено')+'</b>'); });
  b.groups.forEach((g,gi)=>{
    const og = a.groups[gi] || {items:[]};
    g.items.forEach((it,ii)=>{
      const o = og.items[ii];
      if(!o){ ev.push('Додано позицію: <b>'+esc(it.n)+'</b> · '+esc(it.q)+' <span class="muted">('+esc(g.t)+')</span>'); return; }
      if((o.s||'')!==(it.s||'')) ev.push(esc(it.n)+' → <b>'+ST[it.s||'']+'</b> <span class="muted">('+esc(g.t)+')</span>');
      if((o.c||'')!==(it.c||'')) ev.push('Коментар до «'+esc(it.n)+'»: <b>'+(it.c?esc(it.c):'видалено')+'</b>');
    });
  });
  if(JSON.stringify(a.confirm||null)!==JSON.stringify(b.confirm||null) && b.confirm) ev.push('<span class="done">✓ Підтверджено: '+esc(b.confirm.name)+'</span>');
  return ev;
}

function log(){
  if(!H.saves.length) return '<div class="empty">Змін ще немає.</div>';
  const out = []; let prev = H.initial;
  H.saves.forEach(s=>{ const ev = diff(prev, s.state); if(ev.length) out.push([s.ts, ev]); prev = s.state; });
  return '<div class="log">' + out.reverse().map(([ts,ev])=>'<div class="when">'+fmt(ts)+'</div>'+ev.map(e=>'<div class="ev">'+e+'</div>').join('')).join('') + '</div>';
}

document.querySelectorAll('.tabs button[data-t]').forEach(b=>b.onclick=()=>{ tab=b.dataset.t; render(); });
document.getElementById('reload').onclick=load;
load(); setInterval(load, 30000);
</script>
</body>
</html>
